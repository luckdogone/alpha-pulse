[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "alpha-pulse"
version = "0.1.0"
description = "Evidence-based Binance USD-M kline analysis agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "anthropic>=1.4,<2",
  "httpx[socks]>=0.28,<0.29",
  "pydantic>=2.12,<3",
  "pydantic-settings>=2.10,<3",
  "websockets>=15,<18",
  "python-socks[asyncio]>=2.7,<3",
]

[project.scripts]
alpha-pulse = "alpha_pulse.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=1", "ruff>=0.12"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.hatch.build.targets.wheel]
packages = ["src/alpha_pulse"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "scripts", "examples", "README.md", "pyproject.toml", "uv.lock", ".env.example", ".gitignore"]
